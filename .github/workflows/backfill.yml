name: gbf-backfill-test

on:
  workflow_dispatch:
    inputs:
      count:
        description: "How many recent matching posts to backfill"
        required: true
        default: "10"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python gbf_backfill.py
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          BACKFILL_COUNT: ${{ github.event.inputs.count }}
      - run: |
          git config user.name "gbf-bot"
          git config user.email "gbf@users.noreply.github.com"
          git add last_seen.txt
          git commit -m "backfill update" || true
          git push
