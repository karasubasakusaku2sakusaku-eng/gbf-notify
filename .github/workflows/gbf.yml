name: gbf-notify

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python gbf_once.py
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      - run: |
          git config user.name "gbf-bot"
          git config user.email "gbf@users.noreply.github.com"
          git add last_seen.txt
          git commit -m "update" || true
          git push
